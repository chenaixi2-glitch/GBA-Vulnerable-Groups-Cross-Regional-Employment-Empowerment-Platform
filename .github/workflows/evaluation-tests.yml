name: Evaluation Suite

on:
  push:
    paths:
      - 'backend/**'
      - 'evaluation-results/**'
      - '.github/workflows/evaluation-tests.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Planner routing (F1 + agent chain)
        env:
          PYTHONPATH: .
        run: pytest tests/test_planner_routing_eval.py -v --tb=short

      - name: RAG retrieval metrics (lexical)
        env:
          PYTHONPATH: .
        run: pytest tests/test_rag_retrieval_metrics.py -v --tb=short

      - name: Chain consistency
        env:
          PYTHONPATH: .
        run: pytest tests/test_chain_consistency_eval.py -v --tb=short

      - name: Bad-case sampler
        env:
          PYTHONPATH: .
        run: pytest tests/test_bad_case_sampler.py -v --tb=short

      - name: Answer evaluation golden set (keyword/schema)
        env:
          PYTHONPATH: .
        run: pytest tests/test_answer_evaluation_golden.py -v --tb=short -k "not embedding"

      - name: Answer evaluation embedding (optional)
        if: env.DASHSCOPE_API_KEY != ''
        env:
          PYTHONPATH: .
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: pytest tests/test_answer_evaluation_golden.py -v --tb=short -k "embedding"
