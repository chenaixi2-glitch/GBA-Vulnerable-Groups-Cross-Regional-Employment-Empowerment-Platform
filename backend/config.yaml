# AI Career Copilot 配置文件
# 环境相关连接信息（MySQL/Redis 地址、密码）优先由 backend/.env 中的环境变量覆盖。
# 部署说明见 backend/DEPLOYMENT.md

server:
  # 默认本地；Redis 默认复用此 host。线上若 Redis 在本机，请在 .env 中设 REDIS_HOST=127.0.0.1
  host: "127.0.0.1"

llm:
  provider: "openai_compatible"
  model: "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B"
  api_base: "https://api.siliconflow.cn/v1"
  api_key_env: "SILICONFLOW_API_KEY"
  temperature: 0.3
  max_tokens: 8192
  timeout: 180   # per-call; observed ~60–90s on SiliconFlow

# 简历文件 OCR 解析（PDF 等）与画像结构化抽取
# enabled: false = temp off（用 pdfplumber）；改 true 即恢复 DeepSeek-OCR（model 等配置保留）
resume_parse:
  enabled: false
  provider: "openai_compatible"
  model: "deepseek-ai/DeepSeek-OCR"
  api_base: "https://api.siliconflow.cn/v1"
  api_key_env: "SILICONFLOW_API_KEY"
  temperature: 0.0
  max_tokens: 8192
  timeout: 180
  ocr_mode: "grounding"   # free_ocr | grounding
  ocr_dpi: 200
  ocr_parallel_workers: 4

# 简历/界面字段翻译（Hunyuan 翻译模型）
translation:
  provider: "openai_compatible"
  model: "tencent/Hunyuan-MT-7B"
  api_base: "https://api.siliconflow.cn/v1"
  api_key_env: "SILICONFLOW_API_KEY"
  temperature: 0.1
  max_tokens: 4096
  timeout: 120

# 简历内容生成（content_agent）— 与主 LLM 同模型，避免小 instruct 模型润色退化
resume_generation:
  provider: "openai_compatible"
  model: "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B"
  api_base: "https://api.siliconflow.cn/v1"
  api_key_env: "SILICONFLOW_API_KEY"
  temperature: 0.2
  max_tokens: 8192
  timeout: 180

# LLM-as-judge: second model for rubric scoring (relevance, groundedness, actionability)
judge:
  provider: "openai_compatible"
  model: "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B"
  api_base: "https://api.siliconflow.cn/v1"
  api_key_env: "SILICONFLOW_API_KEY"
  temperature: 0.1
  max_tokens: 2048
  timeout: 180

# enabled: false = temp off（无向量 HTTP）；改 true 并打开 vector_store/rag 即恢复
embedding:
  enabled: false
  provider: "openai_compatible"
  model: "Qwen/Qwen3-Embedding-8B"
  api_base: "https://api.siliconflow.cn/v1"
  api_key_env: "SILICONFLOW_API_KEY"

# enabled: false = temp off；改 true 即恢复 Rerank API
rerank:
  enabled: false
  provider: "siliconflow"
  model: "Qwen/Qwen3-Reranker-8B"
  api_base: "https://api.siliconflow.cn/v1"
  api_key_env: "SILICONFLOW_API_KEY"
  top_n: 5
  instruction: "Given a job-seeking or resume optimization query, rank passages by relevance to the candidate profile and target role."

vector_store:
  enabled: false   # temp off with embedding; set true when restoring RAG
  provider: chromadb
  persist_directory: "./data/chroma"

rag:
  enabled: false   # temp off; set true with embedding+rerank+vector_store
  search_top_k: 10
  rerank_top_n: 5
  min_score: 0.0

dialogue_memory:
  raw_turn_limit: 6
  compress_threshold: 10
  max_turn_chars: 800
  summary_max_chars: 2000
  cross_session_enabled: true

# 交互式面试 Prompt 记忆：完整 turns 仍持久化；仅压缩注入 LLM 的历史
interview_memory:
  recent_qa_limit: 6
  compress_threshold: 8
  debrief_recent_qa_limit: 12
  max_block_chars: 1000
  summary_max_chars: 2500
  # 类别加权：同类高、近类中、远类低 → 远类优先压缩
  same_category_weight: 1.0
  near_category_weight: 0.55
  far_category_weight: 0.2
  same_stage_bonus: 0.15
  recency_weight: 0.35
  debrief_category_scale: 0.25  # 复盘时弱化类别偏向，更偏全景

redis:
  host_from: "server"          # 可被 REDIS_HOST 覆盖；线上建议 REDIS_HOST=127.0.0.1
  port: 6379
  db: 0
  password: ""

mysql:
  host_from: "server"          # 可被 MYSQL_HOST 覆盖；线上填 RDS 地址
  port: 3306
  user: "root"                 # 本地 XAMPP；线上在 .env 设 MYSQL_USER=GBA_platform
  password_env: "MYSQL_PASSWORD"
  database: "ai_career_copilot"
  charset: "utf8mb4"
  pool_size: 5

langsmith:
  tracing_v2: true
  project: "ai-career-copilot"
  api_key_env: "LANGCHAIN_API_KEY"
  endpoint: "https://api.smith.langchain.com"

# LLM 并发排队（Redis）；2GB 生产环境建议 max_concurrent: 2
llm_queue:
  enabled: true
  max_concurrent: 2
  avg_job_seconds: 90
  poll_interval_seconds: 1
  session_lock_ttl_seconds: 600

fastapi:
  host: "0.0.0.0"
  port: 8000
  debug: true
  workers: 2

testing:
  integration:
    run_real_llm_tests: true

monitoring:
  bad_case:
    min_answer_score: 60
    flag_failed_nodes: true
    flag_empty_reply: true
    flag_routing_mismatch: true
  langsmith:
    project: "ai-career-copilot"
    export_limit: 50
    lookback_hours: 168


