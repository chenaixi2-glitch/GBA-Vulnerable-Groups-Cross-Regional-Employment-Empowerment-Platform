<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业信息 — GBA Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background: #f8fafc; }
    </style>
</head>
<body class="min-h-screen">
    <header class="bg-white border-b sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="portal.html" class="text-green-700 font-semibold"><i class="fas fa-arrow-left mr-2"></i>返回企业门户</a>
            <span class="text-sm text-gray-500">企业信息登记</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm border p-6 md:p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">上传企业信息</h1>
            <p id="onboard-banner" class="hidden mb-4 p-3 rounded-xl bg-green-50 border border-green-200 text-green-800 text-sm">欢迎注册！请完善企业资料后即可发布岗位。</p>
            <p class="text-gray-600 mb-2">完善企业资料后，发布岗位时将自动关联企业名称，便于求职者了解招聘单位。</p>
            <p id="company-friendly-badge" class="hidden mb-6 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-sm font-semibold">
                <i class="fas fa-heart"></i> 弱势群体友好企业
            </p>

            <form id="company-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">企业名称 <span class="text-red-500">*</span></label>
                    <input id="company_name" required class="w-full border rounded-xl px-4 py-3" placeholder="例：大湾区科技有限公司">
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">所属行业</label>
                        <input id="industry" class="w-full border rounded-xl px-4 py-3" placeholder="例：互联网 / 制造业">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">员工规模</label>
                        <input id="employee_count" class="w-full border rounded-xl px-4 py-3" placeholder="例：50-200人">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">企业简介</label>
                    <textarea id="description" rows="4" class="w-full border rounded-xl px-4 py-3" placeholder="介绍企业业务、文化与发展方向…"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">注册地址</label>
                    <input id="address" class="w-full border rounded-xl px-4 py-3" placeholder="例：深圳市南山区…">
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">联系邮箱</label>
                        <input id="contact_email" type="email" class="w-full border rounded-xl px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">联系电话</label>
                        <input id="contact_phone" class="w-full border rounded-xl px-4 py-3">
                    </div>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">企业官网</label>
                        <input id="website" class="w-full border rounded-xl px-4 py-3" placeholder="https://">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">营业执照编号</label>
                        <input id="license_no" class="w-full border rounded-xl px-4 py-3">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">包容性用工说明</label>
                    <textarea id="inclusivity_info" rows="3" class="w-full border rounded-xl px-4 py-3" placeholder="无障碍设施、灵活办公、弱势群体招聘政策等…"></textarea>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" id="save-btn" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-3 rounded-xl">
                        <i class="fas fa-save mr-2"></i>保存企业信息
                    </button>
                    <a href="post-job.html" class="border border-green-600 text-green-700 font-semibold px-6 py-3 rounded-xl hover:bg-green-50">去发布岗位</a>
                </div>
                <p id="form-msg" class="text-sm hidden"></p>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border p-6 md:p-8 mt-6">
            <h2 class="text-xl font-bold text-gray-900 mb-1">修改密码</h2>
            <p class="text-gray-600 text-sm mb-6">登录状态下可修改密码；请牢记密码，平台暂不支持找回密码。</p>
            <form id="password-form" class="space-y-4 max-w-md">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="password-current">当前密码</label>
                    <input type="password" id="password-current" class="w-full border rounded-xl px-4 py-3" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="password-new">新密码</label>
                    <input type="password" id="password-new" class="w-full border rounded-xl px-4 py-3" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="password-new2">确认新密码</label>
                    <input type="password" id="password-new2" class="w-full border rounded-xl px-4 py-3" />
                </div>
                <button type="submit" id="password-save-btn" class="border border-gray-300 hover:bg-gray-50 text-gray-800 font-semibold px-6 py-3 rounded-xl">更新密码</button>
                <p id="password-form-msg" class="text-sm hidden"></p>
            </form>
        </div>
    </main>

    <script src="../assets/js/auth-api.js"></script>
    <script src="../assets/js/portal-auth.js"></script>
    <script src="../test-data/browser-bundle.js"></script>
    <script src="assets/js/api-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            PortalAuth.guardPortalAuth({ portal: 'corporate', authPage: 'auth.html' });
            if (new URLSearchParams(location.search).get('onboard') === '1') {
                const banner = document.getElementById('onboard-banner');
                if (banner) banner.classList.remove('hidden');
            }
        });

        const fields = ['company_name','industry','employee_count','description','address','contact_email','contact_phone','website','license_no','inclusivity_info'];

        async function loadProfile() {
            try {
                const res = await CorporateAPI.CompanyAPI.getProfile();
                const p = res.data.profile;
                if (!p) return;
                fields.forEach(function (id) {
                    const el = document.getElementById(id);
                    if (el && p[id] != null) el.value = p[id];
                });
                const badge = document.getElementById('company-friendly-badge');
                if (badge) badge.classList.toggle('hidden', !p.vulnerable_group_friendly);
            } catch (e) {
                console.warn('Load profile:', e.message);
            }
        }

        document.getElementById('company-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const msg = document.getElementById('form-msg');
            btn.disabled = true;
            const body = {};
            fields.forEach(function (id) {
                body[id] = document.getElementById(id).value.trim();
            });
            try {
                await CorporateAPI.CompanyAPI.saveProfile(body);
                msg.textContent = '企业信息已保存';
                msg.className = 'text-sm text-green-600';
            } catch (err) {
                msg.textContent = err.message || '保存失败，请先以企业账号登录';
                msg.className = 'text-sm text-red-600';
            } finally {
                btn.disabled = false;
            }
        });

        loadProfile();

        document.getElementById('password-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const msg = document.getElementById('password-form-msg');
            const current = document.getElementById('password-current').value;
            const next = document.getElementById('password-new').value;
            const next2 = document.getElementById('password-new2').value;
            if (next !== next2) {
                msg.textContent = '两次输入的新密码不一致';
                msg.className = 'text-sm text-red-600';
                msg.classList.remove('hidden');
                return;
            }
            const btn = document.getElementById('password-save-btn');
            btn.disabled = true;
            try {
                const res = await AuthAPI.changePassword(current, next);
                msg.textContent = res.message;
                msg.className = 'text-sm ' + (res.success ? 'text-green-600' : 'text-red-600');
                msg.classList.remove('hidden');
                if (res.success) {
                    document.getElementById('password-current').value = '';
                    document.getElementById('password-new').value = '';
                    document.getElementById('password-new2').value = '';
                }
            } finally {
                btn.disabled = false;
            }
        });
    </script>
    <script src="../assets/i18n/i18n.js"></script>
</body>
</html>
