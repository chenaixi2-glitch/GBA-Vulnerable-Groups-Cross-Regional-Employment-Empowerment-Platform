<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业端登录 / 注册 — GBA 就业赋能平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        .auth-tab { flex: 1; padding: .75rem; font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; }
        .auth-tab.active { color: #059669; border-bottom-color: #059669; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-white to-blue-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <a id="auth-back-link" href="../index.html" class="inline-flex items-center text-sm text-gray-500 hover:text-green-600 mb-4">
                <i class="fas fa-arrow-left mr-2"></i>返回首页
            </a>
            <div class="w-14 h-14 mx-auto bg-gradient-to-br from-green-600 to-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mb-3">
                <i class="fas fa-building"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">企业端门户</h1>
            <p class="text-gray-500 text-sm mt-1">招聘方登录或注册企业账号</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border p-6">
            <h2 id="auth-heading" class="text-lg font-bold text-gray-900 mb-4">登录账号</h2>
            <div class="flex border-b border-gray-200 mb-5">
                <button type="button" id="auth-tab-login" class="auth-tab active">登录</button>
                <button type="button" id="auth-tab-register" class="auth-tab">注册</button>
            </div>

            <div id="auth-panel-login" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-login-email">企业联系邮箱</label>
                    <input type="email" id="auth-login-email" autocomplete="username" placeholder="hr@company.com" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-login-password">密码</label>
                    <input type="password" id="auth-login-password" autocomplete="current-password" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <p id="auth-login-error" class="text-red-600 text-sm hidden"></p>
                <button type="button" id="auth-login-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg">登录</button>
            </div>

            <div id="auth-panel-register" class="space-y-4" hidden>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-name">企业 / 联系人名称 <span class="text-gray-400 font-normal">(可选)</span></label>
                    <input type="text" id="auth-register-name" autocomplete="organization" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="例：大湾区科技有限公司" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-email">企业邮箱</label>
                    <input type="email" id="auth-register-email" autocomplete="email" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-password">密码</label>
                    <input type="password" id="auth-register-password" autocomplete="new-password" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-password2">确认密码</label>
                    <input type="password" id="auth-register-password2" autocomplete="new-password" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <p class="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3">
                    <i class="fas fa-exclamation-triangle mr-1"></i>平台暂不支持找回密码，请务必牢记您设置的密码。
                </p>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-invite">企业邀请码 <span class="text-gray-400 font-normal">(加入已有团队时填写)</span></label>
                    <input type="text" id="auth-register-invite" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none font-mono uppercase" placeholder="留空则创建新企业组织" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-hr-title">HR 职位 <span class="text-gray-400 font-normal">(可选)</span></label>
                    <input type="text" id="auth-register-hr-title" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="例：招聘专员" />
                </div>
                <div id="auth-register-profile-wrap" class="hidden"></div>
                <p class="text-xs text-gray-500 bg-green-50 border border-green-100 rounded-lg p-3">注册成功后将引导您完善企业信息，即可发布包容性招聘岗位。</p>
                <p id="auth-register-error" class="text-red-600 text-sm hidden"></p>
                <button type="button" id="auth-register-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg">注册企业账号</button>
            </div>
        </div>

        <p class="text-center text-sm text-gray-500 mt-4">
            求职者？<a href="../individual/auth.html" class="text-blue-600 hover:underline font-medium">前往个人端登录</a>
        </p>
    </div>

    <script src="../assets/js/auth-api.js"></script>
    <script src="../assets/js/auth-ui.js"></script>
    <script>
        AuthUI.initAuthPage({ portal: 'corporate', redirectTo: 'portal.html', homeHref: '../index.html' });
    </script>
    <script src="../assets/i18n/i18n.js"></script>
</body>
</html>
