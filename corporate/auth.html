<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.corporatePortal">Corporate Portal — Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .auth-tab { flex: 1; padding: .75rem; font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; }
        .auth-tab.active { color: #059669; border-bottom-color: #059669; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-white to-blue-50 flex items-center justify-center p-4 relative" data-page="auth">
    <div id="header-lang-slot" class="absolute top-4 right-4"></div>
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <a id="auth-back-link" href="../index.html" class="inline-flex items-center text-sm text-gray-500 hover:text-green-600 mb-4">
                <i class="fas fa-arrow-left mr-2"></i><span data-i18n="auth.backHome">Back to home</span>
            </a>
            <div class="w-14 h-14 mx-auto bg-gradient-to-br from-green-600 to-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mb-3">
                <i class="fas fa-building"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900" data-i18n="auth.corporatePortal">Corporate Portal</h1>
            <p class="text-gray-500 text-sm mt-1" data-i18n="auth.corporateSubtitle">Sign in or register as an employer</p>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border p-6">
            <h2 id="auth-heading" class="text-lg font-bold text-gray-900 mb-4" data-i18n="auth.loginAccount">Sign in</h2>
            <div class="flex border-b border-gray-200 mb-5">
                <button type="button" id="auth-tab-login" class="auth-tab active" data-i18n="auth.login">Log in</button>
                <button type="button" id="auth-tab-register" class="auth-tab" data-i18n="auth.register">Sign up</button>
            </div>

            <div id="auth-panel-login" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-login-email" data-i18n="auth.corporateEmail">Corporate contact email</label>
                    <input type="email" id="auth-login-email" autocomplete="username" placeholder="hr@company.com" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-login-password" data-i18n="auth.password">Password</label>
                    <input type="password" id="auth-login-password" autocomplete="current-password" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <p id="auth-login-error" class="text-red-600 text-sm hidden"></p>
                <button type="button" id="auth-login-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg" data-i18n="auth.login">Log in</button>
            </div>

            <div id="auth-panel-register" class="space-y-4" hidden>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-name"><span data-i18n="auth.companyContactName">Company / contact name</span> <span class="text-gray-400 font-normal" data-i18n="auth.optional">(optional)</span></label>
                    <input type="text" id="auth-register-name" autocomplete="organization" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-email" data-i18n="auth.corporateEmail">Corporate email</label>
                    <input type="email" id="auth-register-email" autocomplete="email" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-password" data-i18n="auth.password">Password</label>
                    <input type="password" id="auth-register-password" autocomplete="new-password" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-password2" data-i18n="auth.confirmPassword">Confirm password</label>
                    <input type="password" id="auth-register-password2" autocomplete="new-password" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <p class="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-3">
                    <i class="fas fa-exclamation-triangle mr-1"></i><span data-i18n="auth.noPasswordRecovery">Password recovery is not available — please remember your password.</span>
                </p>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-invite"><span data-i18n="auth.inviteCode">Organization invite code</span> <span class="text-gray-400 font-normal" data-i18n="auth.inviteOptional">(when joining an existing team)</span></label>
                    <input type="text" id="auth-register-invite" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none font-mono uppercase" data-i18n-placeholder="auth.invitePlaceholder" placeholder="Leave blank to create a new organization" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="auth-register-hr-title"><span data-i18n="auth.hrTitle">HR title</span> <span class="text-gray-400 font-normal" data-i18n="auth.optional">(optional)</span></label>
                    <input type="text" id="auth-register-hr-title" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" />
                </div>
                <div id="auth-register-profile-wrap" class="hidden"></div>
                <p class="text-xs text-gray-500 bg-green-50 border border-green-100 rounded-lg p-3" data-i18n="auth.corporateRegisterHint">After registration you will complete your company profile to post inclusive jobs.</p>
                <p id="auth-register-error" class="text-red-600 text-sm hidden"></p>
                <button type="button" id="auth-register-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg" data-i18n="auth.registerCorporate">Register corporate account</button>
            </div>
        </div>

        <p class="text-center text-sm text-gray-500 mt-4">
            <span data-i18n="auth.individualPrompt">Job seeker?</span>
            <a href="../individual/auth.html" class="text-blue-600 hover:underline font-medium" data-i18n="auth.individualLink">Go to individual sign-in</a>
        </p>
    </div>

    <script src="../assets/i18n/i18n.js"></script>
    <script src="../assets/js/auth-api.js"></script>
    <script src="../assets/js/auth-ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var boot = function () {
                AuthUI.initAuthPage({ portal: 'corporate', redirectTo: 'portal.html', homeHref: '../index.html' });
            };
            if (window.GBAI18n && GBAI18n.initLanguage) {
                GBAI18n.initLanguage().then(boot);
            } else {
                boot();
            }
        });
    </script>
</body>
</html>
