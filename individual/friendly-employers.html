<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弱势群体友好企业 — GBA Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-white border-b px-4 py-3 flex flex-wrap items-center justify-between gap-2 text-sm">
        <a href="../index.html" class="text-blue-700 font-semibold"><i class="fas fa-arrow-left mr-1"></i>首页</a>
        <a href="demo-jobs-database.html?friendly=1" class="text-emerald-700 font-medium">查看友好岗位</a>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">弱势群体友好企业</h1>
        <p class="text-slate-600 mb-6 text-sm">发布包容性岗位或标记优先推荐弱势群体的企业会显示此标签。</p>
        <div id="company-list" class="grid md:grid-cols-2 gap-4"></div>
    </main>
    <script src="assets/js/platform-api.js"></script>
    <script>
        function escape(s) {
            var d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }
        async function load() {
            var list = document.getElementById('company-list');
            list.innerHTML = '<p class="text-slate-500 col-span-2"><i class="fas fa-spinner fa-spin"></i> 加载中…</p>';
            try {
                var res = await PlatformAPI.CompanyAPI.listFriendly();
                var companies = res.data.companies || [];
                if (!companies.length) {
                    list.innerHTML = '<p class="text-slate-500 col-span-2">暂无友好企业，欢迎企业发布包容性岗位。</p>';
                    return;
                }
                list.innerHTML = companies.map(function (c) {
                    return '<article class="bg-white border rounded-2xl p-5 shadow-sm">' +
                        '<div class="flex items-start justify-between gap-2 mb-2">' +
                        '<h2 class="font-bold text-slate-900">' + escape(c.company_name) + '</h2>' +
                        '<span class="shrink-0 px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-xs font-semibold">弱势群体友好</span></div>' +
                        '<p class="text-sm text-slate-500 mb-2">' + escape(c.industry || '行业未填写') + '</p>' +
                        '<p class="text-sm text-slate-600">' + escape(c.inclusivity_info || c.description || '该企业发布了弱势群体友好岗位。') + '</p></article>';
                }).join('');
            } catch (e) {
                list.innerHTML = '<p class="text-red-600 col-span-2">' + escape(e.message) + '</p>';
            }
        }
        load();
    </script>
</body>
</html>
