<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 — GBA 就业赋能平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    </style>
</head>
<body class="min-h-screen">
    <header class="bg-white border-b sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="portal.html" class="text-blue-700 font-semibold"><i class="fas fa-arrow-left mr-2"></i>返回个人门户</a>
            <span class="text-sm text-gray-500">个人资料</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
        <section class="bg-white rounded-2xl shadow-sm border p-6 md:p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">基本信息</h1>
            <p class="text-gray-600 text-sm mb-6">更新您的联系信息与弱势群体画像，系统将据此优化岗位匹配。</p>

            <form id="profile-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">登录邮箱</label>
                    <input id="profile-email" type="email" readonly class="w-full border rounded-xl px-4 py-3 bg-gray-50 text-gray-600" />
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="profile-full-name">显示名称</label>
                        <input id="profile-full-name" class="w-full border rounded-xl px-4 py-3" placeholder="您的姓名或昵称" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="profile-phone">手机号</label>
                        <input id="profile-phone" class="w-full border rounded-xl px-4 py-3" placeholder="选填" />
                    </div>
                </div>

                <div class="p-4 rounded-xl bg-blue-50 border border-blue-100 space-y-4">
                    <h2 class="text-sm font-semibold text-blue-900">弱势群体画像</h2>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1" for="profile-age">年龄 <span class="text-red-500">*</span></label>
                            <input type="number" id="profile-age" min="16" max="100" required class="w-full border rounded-xl px-4 py-3" />
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1" for="profile-gender">性别 <span class="text-red-500">*</span></label>
                            <select id="profile-gender" required class="w-full border rounded-xl px-4 py-3 bg-white"></select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-gray-600 mb-1" for="profile-disability">残疾类型</label>
                            <select id="profile-disability" class="w-full border rounded-xl px-4 py-3 bg-white"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1" for="profile-gap">职业空窗（年）</label>
                            <input type="number" id="profile-gap" min="0" max="50" step="0.5" class="w-full border rounded-xl px-4 py-3" />
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1" for="profile-income">月收入（元） <span class="text-red-500">*</span></label>
                            <input type="number" id="profile-income" min="0" step="100" required class="w-full border rounded-xl px-4 py-3" />
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">系统推断人群标签</label>
                    <div id="profile-group-tags" class="flex flex-wrap gap-2"></div>
                    <p class="text-xs text-gray-500 mt-2">保存资料后标签将自动更新，用于岗位匹配与平台权益判定。</p>
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <button type="submit" id="profile-save-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl">
                        <i class="fas fa-save mr-2"></i>保存资料
                    </button>
                    <p id="profile-form-msg" class="text-sm hidden"></p>
                </div>
            </form>
        </section>

        <section class="bg-white rounded-2xl shadow-sm border p-6 md:p-8">
            <h2 class="text-xl font-bold text-gray-900 mb-1">修改密码</h2>
            <p class="text-gray-600 text-sm mb-6">登录状态下可修改密码；请牢记密码，平台暂不支持找回密码。</p>

            <form id="password-form" class="space-y-4 max-w-md">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="password-current">当前密码</label>
                    <input type="password" id="password-current" autocomplete="current-password" class="w-full border rounded-xl px-4 py-3" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="password-new">新密码</label>
                    <input type="password" id="password-new" autocomplete="new-password" class="w-full border rounded-xl px-4 py-3" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="password-new2">确认新密码</label>
                    <input type="password" id="password-new2" autocomplete="new-password" class="w-full border rounded-xl px-4 py-3" />
                </div>
                <div class="flex items-center gap-3">
                    <button type="submit" id="password-save-btn" class="border border-gray-300 hover:bg-gray-50 text-gray-800 font-semibold px-6 py-3 rounded-xl">
                        更新密码
                    </button>
                    <p id="password-form-msg" class="text-sm hidden"></p>
                </div>
            </form>
        </section>
    </main>

    <script src="../assets/js/auth-api.js"></script>
    <script src="../assets/js/portal-auth.js"></script>
    <script src="../assets/js/user-profile.js"></script>
    <script>document.addEventListener('DOMContentLoaded', function () { UserProfile.init(); });</script>
</body>
</html>
